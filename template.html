<title>Kommunkampen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: en smal spalt som ett frågekort på en kommunal anslagstavla; falurött som signalfärg, kommunkod och länsnamn som detalj */
:root {
  --paper: #EFF2EE;
  --card: #FBFCFA;
  --ink: #18241E;
  --muted: #5A6A61;
  --line: #CFD7D1;
  --accent: #9E2B25;
  --accent-ink: #FFFFFF;
  --ok: #24724A;
  --ok-soft: #DCEFE3;
  --bad: #9E2B25;
  --bad-soft: #F5DFDC;
  --bar: #B9C6BE;
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111714; --card: #18201C; --ink: #E5ECE7; --muted: #98A79F; --line: #2B3731;
    --accent: #E26A5E; --accent-ink: #1A0E0C; --ok: #63C28A; --ok-soft: #173426;
    --bad: #E26A5E; --bad-soft: #3A1D1A; --bar: #3E4D45; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111714; --card: #18201C; --ink: #E5ECE7; --muted: #98A79F; --line: #2B3731;
  --accent: #E26A5E; --accent-ink: #1A0E0C; --ok: #63C28A; --ok-soft: #173426;
  --bad: #E26A5E; --bad-soft: #3A1D1A; --bar: #3E4D45; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-display); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.35rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.brand::before { content: ""; width: 14px; height: 14px; background: var(--accent); border-radius: 2px; transform: rotate(45deg); }
.meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); display: flex; gap: 14px; font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); font-weight: 500; }
.progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.progress span { height: 5px; border-radius: 3px; background: var(--line); }
.progress span.ok { background: var(--ok); }
.progress span.bad { background: var(--bad); }
.progress span.now { background: var(--ink); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: clamp(1.3rem, 5vw, 1.6rem); line-height: 1.2; margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }

.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  font: inherit; color: inherit; text-align: left; cursor: pointer;
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center;
  transition: border-color .15s, background .15s;
  position: relative; overflow: hidden;
}
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt .name { font-weight: 600; font-size: 1.05rem; min-width: 0; }
.opt .lan { grid-column: 1; font-size: 0.82rem; color: var(--muted); }
.opt .code { grid-row: 1 / span 2; grid-column: 2; font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
.opt .val { grid-row: 1 / span 2; grid-column: 2; font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.opt .barbox { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; position: relative; }
.opt .barfill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--bar); width: 0; transition: width .6s cubic-bezier(.2,.7,.2,1); }
.opt .natmark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); opacity: .55; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .barfill { background: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .barfill { background: var(--bad); }
.opt .tag { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: .05em; text-transform: uppercase; }
.opt.correct .tag { color: var(--ok); }
.opt.wrong .tag { color: var(--bad); }
@media (prefers-reduced-motion: reduce) { .opt .barfill { transition: none; } }

.feedback { display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.feedback .verdict { font-weight: 700; font-size: 1.1rem; }
.feedback .verdict.ok { color: var(--ok); }
.feedback .verdict.bad { color: var(--bad); }
.feedback .small { color: var(--muted); font-size: 0.82rem; }
.legend { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--muted); }
.legend i { width: 2px; height: 14px; background: var(--ink); opacity: .55; display: inline-block; }

.btn {
  font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); padding: 14px 18px; font-size: 1rem;
}
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }

.result { text-align: left; }
.big { font-size: 3.2rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.big small { font-size: 1.2rem; color: var(--muted); font-weight: 500; }
.recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 0.88rem; }
.recap li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.recap .m { font-family: var(--font-mono); }
.recap .ok { color: var(--ok); } .recap .bad { color: var(--bad); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

footer { font-size: 0.78rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
footer a { color: inherit; }
</style>

<div class="wrap">
  <header>
    <div class="brand">Kommunkampen</div>
    <div class="meta" aria-live="polite">
      <span>Fråga <b id="qnum">1</b>/10</span>
      <span>Poäng <b id="score">0</b></span>
      <span>Rekord <b id="best">–</b></span>
    </div>
  </header>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <main id="stage"></main>
  <footer>
    <span>Källa: Kolada (<a href="https://www.kolada.se" target="_blank" rel="noopener">kolada.se</a>). Frågorna slumpas fram ur Koladas nyckeltal för Sveriges 290 kommuner.</span>
    <span id="years"></span>
  </footer>
</div>

<script>
const DATA = /*__QUIZ_DATA__*/null;
const ROUND = 10;
const LAN = {"01":"Stockholms län","03":"Uppsala län","04":"Södermanlands län","05":"Östergötlands län","06":"Jönköpings län","07":"Kronobergs län","08":"Kalmar län","09":"Gotlands län","10":"Blekinge län","12":"Skåne län","13":"Hallands län","14":"Västra Götalands län","17":"Värmlands län","18":"Örebro län","19":"Västmanlands län","20":"Dalarnas län","21":"Gävleborgs län","22":"Västernorrlands län","23":"Jämtlands län","24":"Västerbottens län","25":"Norrbottens län"};
const muni = Object.fromEntries(DATA.municipalities.map(m => [m.id, m]));

const $ = id => document.getElementById(id);
const fmt = (v, d) => v.toLocaleString("sv-SE", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtVal = (k, v) => fmt(v, k.decimals) + (k.unit === "%" ? " %" : k.suffix ? " " + k.suffix : "");

function store(key, val) {
  try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch (e) { return null; }
}

// Viktat urval: större kommuner dyker upp oftare, så att frågorna känns igen, men alla kan förekomma.
function pickWeighted(ids, n) {
  const pool = ids.map(id => ({ id, w: Math.sqrt(muni[id].pop || 1000) }));
  const out = [];
  while (out.length < n && pool.length) {
    const total = pool.reduce((s, p) => s + p.w, 0);
    let r = Math.random() * total, i = 0;
    while (r > pool[i].w) { r -= pool[i].w; i++; }
    out.push(pool.splice(i, 1)[0].id);
  }
  return out;
}

// used: kommuner som redan visats i omgången. De undviks så länge det finns tillräckligt många andra.
function makeQuestion(kpi, used) {
  const dir = Math.random() < 0.5 ? "high" : "low";
  const all = Object.keys(kpi.values);
  const fresh = all.filter(id => !used.has(id));
  for (let tries = 0; tries < 600; tries++) {
    const ids = tries < 300 && fresh.length >= 20 ? fresh : all;
    const four = pickWeighted(ids, 4);
    const sorted = [...four].sort((a, b) => kpi.values[b] - kpi.values[a]);
    const [first, second] = dir === "high" ? [sorted[0], sorted[1]] : [sorted[3], sorted[2]];
    const a = kpi.values[first], b = kpi.values[second];
    const gap = Math.abs(a - b);
    const ok = kpi.minGapRel ? gap / Math.max(a, b) >= kpi.minGapRel : gap >= kpi.minGapAbs;
    if (ok) { four.forEach(id => used.add(id)); return { kpi, dir, options: four, answer: first }; }
  }
  return null;
}

function buildRound() {
  const order = [];
  while (order.length < ROUND) {
    const shuffled = [...DATA.kpis].sort(() => Math.random() - 0.5);
    for (const k of shuffled) if (order.length < ROUND && order[order.length - 1] !== k) order.push(k);
  }
  const used = new Set();
  return order.map(k => makeQuestion(k, used)).filter(Boolean);
}

let state;
function newGame() {
  state = { qs: buildRound(), i: 0, score: 0, results: [] };
  renderQuestion();
}

function renderProgress() {
  $("progress").innerHTML = Array.from({ length: ROUND }, (_, i) => {
    const r = state.results[i];
    const cls = r === true ? "ok" : r === false ? "bad" : i === state.i ? "now" : "";
    return `<span class="${cls}"></span>`;
  }).join("");
  $("qnum").textContent = Math.min(state.i + 1, ROUND);
  $("score").textContent = state.score;
  const best = store("kk-best");
  $("best").textContent = best ?? "–";
}

function renderQuestion() {
  const q = state.qs[state.i];
  renderProgress();
  const stage = $("stage");
  stage.innerHTML = `
    <section class="card">
      <div class="eyebrow">Fråga ${state.i + 1} · ${q.kpi.short} · ${q.kpi.year}</div>
      <h1>${q.kpi[q.dir]}</h1>
      <div class="options" id="opts">
        ${q.options.map((id, n) => `
          <button class="opt" id="opt-${n}" data-id="${id}">
            <span class="name">${muni[id].name}</span>
            <span class="lan">${LAN[id.slice(0, 2)] || ""}</span>
            <span class="code" aria-label="Kommunkod">${id}</span>
          </button>`).join("")}
      </div>
      <div id="after"></div>
    </section>`;
  stage.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answer(b.dataset.id)));
  stage.querySelector(".opt").focus({ preventScroll: true });
}

function answer(picked) {
  const q = state.qs[state.i];
  const right = picked === q.answer;
  if (right) state.score++;
  state.results[state.i] = right;
  q.picked = picked;
  renderProgress();

  const k = q.kpi;
  const vals = q.options.map(id => k.values[id]);
  const scaleMax = Math.max(...vals, k.national ?? 0) * 1.05;

  document.querySelectorAll(".opt").forEach(b => {
    const id = b.dataset.id;
    b.disabled = true;
    const isAns = id === q.answer, isPick = id === picked;
    if (isAns) b.classList.add("correct");
    else if (isPick) b.classList.add("wrong");
    const tag = isAns ? `<span class="tag">Rätt svar</span>` : isPick ? `<span class="tag">Ditt svar</span>` : "";
    b.querySelector(".code").outerHTML = `<span class="val">${fmtVal(k, k.values[id])}</span>`;
    b.querySelector(".lan").innerHTML = `${LAN[id.slice(0, 2)] || ""}${tag ? " · " + tag : ""}`;
    const nat = k.national != null ? `<span class="natmark" style="left:${(k.national / scaleMax * 100).toFixed(2)}%"></span>` : "";
    b.insertAdjacentHTML("beforeend", `<span class="barbox"><span class="barfill"></span>${nat}</span>`);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      b.querySelector(".barfill").style.width = (k.values[id] / scaleMax * 100).toFixed(2) + "%";
    }));
  });

  const last = state.i === state.qs.length - 1;
  $("after").innerHTML = `
    <div class="feedback">
      <span class="verdict ${right ? "ok" : "bad"}">${right ? "Rätt!" : `Fel. Rätt svar är ${muni[q.answer].name}.`}</span>
      ${k.national != null ? `<span class="legend"><i></i>Riket: ${fmtVal(k, k.national)}</span>` : ""}
      <span class="small">${k.label}, ${k.year}.${k.note ? " " + k.note : ""} Källa: Kolada.</span>
    </div>
    <button class="btn" id="next" style="margin-top:14px">${last ? "Se resultat" : "Nästa fråga"}</button>`;
  $("next").addEventListener("click", () => { state.i++; last ? renderEnd() : renderQuestion(); });
  $("next").focus({ preventScroll: true });
}

function renderEnd() {
  const prev = Number(store("kk-best") || 0);
  const isRecord = state.score > prev;
  if (isRecord) store("kk-best", String(state.score));
  renderProgress();
  $("qnum").textContent = ROUND;
  const verdict = state.score >= 9 ? "Du kan din kommunstatistik." : state.score >= 6 ? "Bra jobbat." : state.score >= 3 ? "Kommunsverige är fullt av överraskningar." : "Nu vet du mer än innan.";
  $("stage").innerHTML = `
    <section class="card result">
      <div class="eyebrow">Resultat${isRecord && prev > 0 ? " · Nytt rekord" : ""}</div>
      <div class="big">${state.score}<small> av ${state.qs.length}</small></div>
      <h1>${verdict}</h1>
      <ul class="recap">
        ${state.qs.map((q, i) => `<li>
          <span class="${state.results[i] ? "ok" : "bad"}">${state.results[i] ? "✓" : "✕"}</span>
          <span>${q.kpi[q.dir]} <span class="m">${muni[q.answer].name} (${fmtVal(q.kpi, q.kpi.values[q.answer])})</span></span>
        </li>`).join("")}
      </ul>
      <div class="row"><button class="btn" id="again">Spela igen</button></div>
    </section>`;
  $("again").addEventListener("click", newGame);
  $("again").focus({ preventScroll: true });
}

$("years").textContent = "Data: " + DATA.kpis.map(k => `${k.short} ${k.year}`).join(" · ");
newGame();
</script>
